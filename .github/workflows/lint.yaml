# Lint and site-check jobs: lintr::lint_package() and
# pkgdown::check_pkgdown() don't need the package's (heavy) dependencies
# installed, so each job installs only its own tool.
on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]

name: lint

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  site-check:
    # Checks that _pkgdown.yml indexes every help topic and vignette, and
    # that its URL matches DESCRIPTION. It doesn't build the site; the
    # deploy workflow does that (ADR-0007).
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pkgdown
        run: install.packages("pkgdown")
        shell: Rscript {0}

      - name: Check the pkgdown configuration
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
