<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Contamination in protein (ADT) data, and what DecontPro estimates</title>
  <desc id="d">Top: in a microfluidic channel, stained cells and free antibodies are split into droplets: droplets with a cell, empty droplets with free antibodies (ambient), and spongelets, which have no cell but a medium level of ADTs. Bottom left: DecontPro splits one B cell's ADT counts into native, ambient and background parts. Bottom right: before decontamination a T cell ADT has a peak in the other cells; after, those cells are near zero and the T cell peak remains.</desc>
  <defs>
    <path id="ab" d="M0,4.5 V0 M0,0 L-3.8,-4.8 M0,0 L3.8,-4.8" fill="none" stroke-width="2" stroke-linecap="round"/>
  </defs>
  <rect width="1000" height="590" rx="14" fill="#fff"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Where the extra ADT counts come from</text>

  <!-- Channel fills and walls -->
  <rect x="30" y="95" width="300" height="70" fill="#F3F7FB"/>
  <rect x="330" y="45" width="50" height="50" fill="#FBF3DD"/>
  <rect x="330" y="165" width="50" height="50" fill="#FBF3DD"/>
  <rect x="330" y="95" width="650" height="70" fill="#FBF3DD"/>
  <path d="M330,95 L372,120 L372,140 L330,165 Z" fill="#F3F7FB"/>
  <g fill="none" stroke="#8DA6BD" stroke-width="2">
    <path d="M30,95 H330 V45"/><path d="M380,45 V95 H980"/>
    <path d="M30,165 H330 V215"/><path d="M380,215 V165 H980"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="390" y="68" text-anchor="start">oil</text><text x="390" y="200" text-anchor="start">oil</text>
  </g>
  <text x="180" y="85" text-anchor="middle" font-size="13" fill="#222">cell suspension: stained cells and free antibodies</text>

  <!-- Inlet: stained cells (blue antibodies bound) and free antibodies (orange) -->
  <g fill="#D6E6F5" stroke="#0072B2" stroke-width="2">
    <circle cx="75" cy="130" r="15"/><circle cx="185" cy="130" r="15"/><circle cx="290" cy="130" r="15"/>
  </g>
  <g stroke="#0072B2">
    <use href="#ab" transform="translate(75,110)"/><use href="#ab" transform="translate(92.3,120) rotate(60)"/>
    <use href="#ab" transform="translate(92.3,140) rotate(120)"/><use href="#ab" transform="translate(75,150) rotate(180)"/>
    <use href="#ab" transform="translate(57.7,140) rotate(240)"/><use href="#ab" transform="translate(57.7,120) rotate(300)"/>
    <use href="#ab" transform="translate(185,110)"/><use href="#ab" transform="translate(202.3,140) rotate(120)"/>
    <use href="#ab" transform="translate(167.7,140) rotate(240)"/>
    <use href="#ab" transform="translate(290,110)"/><use href="#ab" transform="translate(307.3,120) rotate(60)"/>
    <use href="#ab" transform="translate(272.7,140) rotate(240)"/><use href="#ab" transform="translate(290,150) rotate(180)"/>
  </g>
  <g stroke="#E69F00">
    <use href="#ab" transform="translate(125,112) rotate(20)"/><use href="#ab" transform="translate(130,150) rotate(-40)"/>
    <use href="#ab" transform="translate(240,108) rotate(70)"/><use href="#ab" transform="translate(236,152) rotate(-10)"/>
    <use href="#ab" transform="translate(42,150) rotate(30)"/><use href="#ab" transform="translate(150,132) rotate(100)"/>
    <use href="#ab" transform="translate(320,152) rotate(-60)"/>
  </g>

  <!-- Droplets in a line -->
  <g fill="#EEF5FB" stroke="#7FB2D9" stroke-width="1.5">
    <circle cx="440" cy="130" r="30"/><circle cx="520" cy="130" r="30"/><circle cx="600" cy="130" r="30"/>
    <circle cx="680" cy="130" r="30"/><circle cx="760" cy="130" r="30"/><circle cx="840" cy="130" r="30"/>
    <circle cx="920" cy="130" r="30"/>
  </g>
  <!-- cells in droplets 440, 520, 680, 920 -->
  <g fill="#D6E6F5" stroke="#0072B2" stroke-width="1.5">
    <circle cx="440" cy="130" r="11"/><circle cx="520" cy="130" r="11"/>
    <circle cx="680" cy="130" r="11"/><circle cx="920" cy="130" r="11"/>
  </g>
  <g stroke="#0072B2">
    <use href="#ab" transform="translate(440,115)"/><use href="#ab" transform="translate(455,130) rotate(90)"/><use href="#ab" transform="translate(425,130) rotate(270)"/>
    <use href="#ab" transform="translate(520,115)"/><use href="#ab" transform="translate(520,145) rotate(180)"/>
    <use href="#ab" transform="translate(680,115)"/><use href="#ab" transform="translate(695,130) rotate(90)"/><use href="#ab" transform="translate(680,145) rotate(180)"/>
    <use href="#ab" transform="translate(920,115)"/><use href="#ab" transform="translate(905,130) rotate(270)"/>
  </g>
  <!-- ambient: free antibodies -->
  <g stroke="#E69F00">
    <use href="#ab" transform="translate(458,150) rotate(-30)"/>
    <use href="#ab" transform="translate(503,112) rotate(40)"/>
    <use href="#ab" transform="translate(588,118) rotate(-20)"/><use href="#ab" transform="translate(612,142) rotate(60)"/><use href="#ab" transform="translate(596,148) rotate(150)"/>
    <use href="#ab" transform="translate(664,147) rotate(20)"/>
    <use href="#ab" transform="translate(856,146) rotate(-50)"/><use href="#ab" transform="translate(828,116) rotate(30)"/>
    <use href="#ab" transform="translate(938,112) rotate(60)"/>
    <use href="#ab" transform="translate(778,130) rotate(80)"/><use href="#ab" transform="translate(738,129) rotate(-70)"/>
  </g>
  <!-- background: grey; in cell droplets and in spongelets (760) -->
  <g stroke="#8C8C8C">
    <use href="#ab" transform="translate(424,112) rotate(-40)"/>
    <use href="#ab" transform="translate(538,146) rotate(120)"/>
    <use href="#ab" transform="translate(698,112) rotate(50)"/>
    <use href="#ab" transform="translate(904,150) rotate(-110)"/>
    <use href="#ab" transform="translate(748,114) rotate(-20)"/><use href="#ab" transform="translate(772,116) rotate(40)"/>
    <use href="#ab" transform="translate(760,132) rotate(90)"/><use href="#ab" transform="translate(746,146) rotate(200)"/>
    <use href="#ab" transform="translate(774,148) rotate(-150)"/>
  </g>

  <g stroke="#999" stroke-width="1">
    <line x1="440" y1="168" x2="440" y2="180"/><line x1="600" y1="168" x2="600" y2="180"/><line x1="760" y1="168" x2="760" y2="180"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="440" y="196">cell</text>
    <text x="600" y="196">empty droplet:</text><text x="600" y="212">free antibodies only</text>
    <text x="760" y="196">spongelet: no cell,</text><text x="760" y="212">medium ADT counts</text>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="500" y="250">Free antibodies (ambient) are captured in every droplet. Background, such as non-specific binding or spongelets,</text>
    <text x="500" y="268">adds a low level of many ADTs to every cell.</text>
  </g>

  <line x1="30" y1="290" x2="970" y2="290" stroke="#DDD" stroke-width="1.5"/>

  <!-- What DecontPro estimates for one B cell -->
  <text x="190" y="322" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">What DecontPro estimates for one B cell</text>
  <text x="190" y="344" text-anchor="middle" font-size="14" fill="#555">counts = native + ambient + background</text>
  <rect x="70" y="380" width="50" height="90" fill="#0072B2"/>
  <rect x="70" y="370" width="50" height="10" fill="#E69F00"/>
  <rect x="70" y="356" width="50" height="14" fill="#8C8C8C"/>
  <rect x="165" y="456" width="50" height="14" fill="#E69F00"/>
  <rect x="165" y="442" width="50" height="14" fill="#8C8C8C"/>
  <rect x="260" y="459" width="50" height="11" fill="#E69F00"/>
  <rect x="260" y="445" width="50" height="14" fill="#8C8C8C"/>
  <line x1="55" y1="470" x2="325" y2="470" stroke="#222" stroke-width="1.5"/>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="95" y="490">B cell</text><text x="95" y="506">ADT</text>
    <text x="190" y="490">T cell</text><text x="190" y="506">ADT</text>
    <text x="285" y="490">Monocyte</text><text x="285" y="506">ADT</text>
  </g>

  <line x1="380" y1="305" x2="380" y2="520" stroke="#EEE" stroke-width="1.5"/>

  <!-- One ADT across all cells -->
  <text x="700" y="322" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">A T cell ADT across all cells</text>
  <text x="555" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Before</text>
  <text x="845" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">After</text>
  <g transform="translate(425,358)">
    <path d="M0,120 L0.0,120.0 L2.2,120.0 L4.4,120.0 L6.6,120.0 L8.7,120.0 L10.9,120.0 L13.1,120.0 L15.3,120.0 L17.5,119.9 L19.7,119.9 L21.8,119.8 L24.0,119.8 L26.2,119.7 L28.4,119.5 L30.6,119.3 L32.8,119.0 L35.0,118.7 L37.1,118.2 L39.3,117.5 L41.5,116.7 L43.7,115.7 L45.9,114.5 L48.1,113.0 L50.3,111.2 L52.4,109.2 L54.6,106.8 L56.8,104.2 L59.0,101.3 L61.2,98.3 L63.4,95.1 L65.5,91.8 L67.7,88.5 L69.9,85.4 L72.1,82.5 L74.3,79.9 L76.5,77.8 L78.7,76.2 L80.8,75.2 L83.0,74.8 L85.2,75.1 L87.4,76.0 L89.6,77.5 L91.8,79.5 L93.9,82.0 L96.1,84.9 L98.3,88.0 L100.5,91.2 L102.7,94.5 L104.9,97.8 L107.1,100.9 L109.2,103.8 L111.4,106.4 L113.6,108.8 L115.8,110.9 L118.0,112.7 L120.2,114.3 L122.4,115.5 L124.5,116.6 L126.7,117.4 L128.9,118.0 L131.1,118.5 L133.3,118.9 L135.5,119.2 L137.6,119.4 L139.8,119.5 L142.0,119.5 L144.2,119.5 L146.4,119.4 L148.6,119.2 L150.8,118.9 L152.9,118.6 L155.1,118.2 L157.3,117.6 L159.5,116.9 L161.7,116.0 L163.9,115.0 L166.1,113.8 L168.2,112.5 L170.4,110.9 L172.6,109.2 L174.8,107.4 L177.0,105.4 L179.2,103.4 L181.3,101.4 L183.5,99.5 L185.7,97.6 L187.9,96.0 L190.1,94.6 L192.3,93.5 L194.5,92.7 L196.6,92.3 L198.8,92.4 L201.0,92.8 L203.2,93.6 L205.4,94.7 L207.6,96.2 L209.7,97.8 L211.9,99.7 L214.1,101.7 L216.3,103.7 L218.5,105.7 L220.7,107.6 L222.9,109.4 L225.0,111.1 L227.2,112.6 L229.4,114.0 L231.6,115.2 L233.8,116.2 L236.0,117.0 L238.2,117.7 L240.3,118.2 L242.5,118.7 L244.7,119.0 L246.9,119.3 L249.1,119.5 L251.3,119.6 L253.4,119.7 L255.6,119.8 L257.8,119.9 L260.0,119.9 L260,120 Z" fill="#D9D9D9" stroke="#666" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="260" y2="120" stroke="#222" stroke-width="1.5"/>
    <g font-size="12" fill="#333" text-anchor="middle">
      <text x="83" y="38">other cells:</text><text x="83" y="52">ambient + background</text>
      <text x="200" y="38">T cells</text>
    </g>
  </g>
  <g transform="translate(715,358)">
    <path d="M0,120 L0.0,113.1 L2.2,107.2 L4.4,98.1 L6.6,85.4 L8.7,69.5 L10.9,51.7 L13.1,34.8 L15.3,21.6 L17.5,15.0 L19.7,16.4 L21.8,25.5 L24.0,40.3 L26.2,57.8 L28.4,75.2 L30.6,90.1 L32.8,101.6 L35.0,109.5 L37.1,114.5 L39.3,117.3 L41.5,118.8 L43.7,119.5 L45.9,119.8 L48.1,119.9 L50.3,120.0 L52.4,120.0 L54.6,120.0 L56.8,120.0 L59.0,120.0 L61.2,120.0 L63.4,120.0 L65.5,120.0 L67.7,120.0 L69.9,120.0 L72.1,120.0 L74.3,120.0 L76.5,120.0 L78.7,120.0 L80.8,120.0 L83.0,120.0 L85.2,120.0 L87.4,120.0 L89.6,120.0 L91.8,120.0 L93.9,120.0 L96.1,120.0 L98.3,120.0 L100.5,120.0 L102.7,120.0 L104.9,120.0 L107.1,120.0 L109.2,120.0 L111.4,120.0 L113.6,120.0 L115.8,120.0 L118.0,120.0 L120.2,120.0 L122.4,120.0 L124.5,120.0 L126.7,119.9 L128.9,119.9 L131.1,119.8 L133.3,119.8 L135.5,119.7 L137.6,119.5 L139.8,119.4 L142.0,119.1 L144.2,118.8 L146.4,118.4 L148.6,117.9 L150.8,117.2 L152.9,116.4 L155.1,115.5 L157.3,114.4 L159.5,113.1 L161.7,111.6 L163.9,110.0 L166.1,108.2 L168.2,106.3 L170.4,104.3 L172.6,102.3 L174.8,100.3 L177.0,98.4 L179.2,96.7 L181.3,95.1 L183.5,93.9 L185.7,93.0 L187.9,92.5 L190.1,92.3 L192.3,92.6 L194.5,93.2 L196.6,94.2 L198.8,95.5 L201.0,97.1 L203.2,98.9 L205.4,100.8 L207.6,102.8 L209.7,104.8 L211.9,106.8 L214.1,108.7 L216.3,110.4 L218.5,112.0 L220.7,113.4 L222.9,114.7 L225.0,115.8 L227.2,116.7 L229.4,117.4 L231.6,118.0 L233.8,118.5 L236.0,118.9 L238.2,119.2 L240.3,119.4 L242.5,119.6 L244.7,119.7 L246.9,119.8 L249.1,119.9 L251.3,119.9 L253.4,119.9 L255.6,120.0 L257.8,120.0 L260.0,120.0 L260,120 Z" fill="#D9D9D9" stroke="#666" stroke-width="1.5"/>
    <line x1="0" y1="120" x2="260" y2="120" stroke="#222" stroke-width="1.5"/>
    <g font-size="12" fill="#333">
      <text x="40" y="20">other cells: near 0</text>
      <text x="190" y="38" text-anchor="middle">T cells</text>
    </g>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="555" y="496">ADT counts (log scale)</text><text x="845" y="496">ADT counts (log scale)</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#222">
    <rect x="70" y="540" width="14" height="14" fill="#0072B2"/>
    <text x="92" y="552">Native: antibodies bound to the cell</text>
    <rect x="355" y="540" width="14" height="14" fill="#E69F00"/>
    <text x="377" y="552">Ambient: free antibodies</text>
    <rect x="580" y="540" width="14" height="14" fill="#8C8C8C"/>
    <text x="602" y="552">Background (e.g. non-specific binding, spongelets)</text>
  </g>
</svg>
